<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#0f1b33;--mu:#5b6b85;--ln:#d8e0ec;--ac:#1b3a6b;--ac2:#fff;--nv:#13284d;--nv2:#e3eaf5;--rd:#d93a2f;--gr:#1f9d55;--am:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1222;--card:#121d33;--tx:#e8eefa;--mu:#9aabc8;--ln:#24334f;--ac:#8fb0ec;--ac2:#0a1222;--nv:#0d1a33;--nv2:#1a2a48;--rd:#f26b61;--gr:#4cc383;--am:#eaa93a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1222;--card:#121d33;--tx:#e8eefa;--mu:#9aabc8;--ln:#24334f;--ac:#8fb0ec;--ac2:#0a1222;--nv:#0d1a33;--nv2:#1a2a48;--rd:#f26b61;--gr:#4cc383;--am:#eaa93a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button,select,input,textarea{font:inherit;color:var(--tx)}button{cursor:pointer}
header{padding:14px 16px 12px;background:var(--nv);color:#fff;margin-bottom:8px;border-radius:0 0 18px 18px}header .sub{color:#b9c7e0}header .ib{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;overflow-wrap:anywhere}.sub{color:var(--mu);font-size:14px}
.ib{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:20px;padding:0}
main{padding:8px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:11px;color:var(--mu);position:relative}
nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--ac);font-weight:700}nav button.on i{background:var(--nv2);border-radius:12px;margin:0 22%}
.bd{position:absolute;top:2px;left:55%;background:var(--rd);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px}
.big{display:flex;gap:10px;margin:8px 0 10px}.big button{flex:1;border:0;border-radius:14px;padding:16px 8px;background:var(--ac);color:var(--ac2);font-weight:600;font-size:16px}
.big button.s{background:var(--card);color:var(--ac);border:1px solid var(--ln)}
h2{font-size:13px;color:var(--mu);margin:20px 2px 8px;font-weight:600;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--ln);border-left:3px solid var(--ln);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.card.u1{border-left-color:var(--am)}.card.u2{border-left-color:var(--rd)}.card.dn{opacity:.6}
.card b{display:block;font-size:15.5px;font-weight:600;line-height:1.35}.mu{color:var(--mu);font-size:13px}.who{color:var(--tx);font-weight:600}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);margin:6px 6px 0 0;font-weight:600;border:0}
.tag.w{color:var(--am)}.tag.a{color:var(--ac)}.tag.d{color:var(--gr)}.tag.r{color:var(--rd)}
.segs{display:flex;gap:4px;padding:4px;background:var(--ln);border-radius:14px;margin:4px 0 10px}.seg{flex:1;min-height:42px;padding:4px 6px;line-height:1.2;border:0;border-radius:10px;background:transparent;color:var(--mu);font-weight:600;font-size:13px}.seg.on{background:var(--card);color:var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.15)}.qrow{display:flex;gap:8px;margin-top:10px}.qa{flex:1;min-height:42px}.qa.ok{background:#e3f6ea;color:#14693a;border:0}.card .row{align-items:center;gap:12px}.card .row>.av{width:36px;height:36px;font-size:12px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:var(--ac2);font-weight:600}
.btn.g{background:var(--card);color:var(--ac);border:1px solid var(--ln)}.btn.f{width:100%;margin-top:16px;font-size:17px}.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}.btn.dg{color:var(--rd)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;border-radius:99px;background:var(--ac);color:var(--ac2);font-weight:700;padding:14px 20px;box-shadow:0 4px 16px #0005;z-index:6}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}#m.on{display:flex}
.sheet{background:var(--bg);width:100%;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
.in{width:100%;padding:13px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.scr{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px;padding:0 16px 6px;scrollbar-width:none}.chips.scr::-webkit-scrollbar{display:none}.chips.scr .chip{white-space:nowrap;flex:none}.big.cmp button{padding:10px 8px;font-size:15px;border-radius:12px}
.chip{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:9px 14px}
.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}.empty .e{font-size:44px}
.rep{background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}.rep.me{background:var(--ac);color:var(--ac2)}.rep.me .mu{color:inherit;opacity:.8}.rep.sys{background:none;text-align:center;color:var(--mu);font-size:13px}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--mu);background:none;flex:none;font-size:15px;color:#fff;padding:0}.ck.on{background:var(--gr);border-color:var(--gr)}
.row{display:flex;gap:12px;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:30;max-width:90%;text-align:center}
.bar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.st{cursor:pointer;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 2px;text-align:center}.st b{font-size:22px;display:block}.st .mu{font-size:11px}
details{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px}
summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.load{height:6px;background:var(--ln);border-radius:99px;overflow:hidden;margin-top:6px}.load i{display:block;height:100%;background:var(--ac)}.load.hi i{background:var(--rd)}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--ln);display:block}
.file{display:inline-block;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;color:var(--ac);text-decoration:none;font-size:14px;background:var(--bg)}
.dec{border-left:4px solid var(--gr);background:var(--card);border-radius:12px;padding:10px 12px;margin:10px 0}
textarea.pre{width:100%;height:46vh;font:13px/1.45 ui-monospace,Menlo,monospace;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
